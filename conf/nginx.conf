worker_processes  1;

events {
    worker_connections  1024;
}

http {
    server {
        listen 8080 http2;
        listen 8443 ssl http2;
        server_name dmoffat.com;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;

        return 301 https://www.$server_name$request_uri;
    }

    server {
        listen 8443 ssl http2;
        server_name www.dmoffat.com;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        error_page 404 /404.html;

        # Serve nginx's 404 page
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Cache images
        location ~* \.(avif|webp)$ {
            expires 1y;
        }

        location / {
            try_files $uri $uri/index.html =404;
        }
    }

    # Trips - a separate project (~/dev/trips), deployed independently
    server {
        listen 8080 http2;
        server_name trips.dmoffat.com;

        return 301 https://trips.dmoffat.com$request_uri;
    }

    server {
        listen 8443 ssl http2;
        server_name trips.dmoffat.com;

        # Covered by the existing wildcard *.dmoffat.com certificate — no separate cert needed.
        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;

        client_max_body_size 10m;

        location / {
            # Docker's embedded DNS.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $trips_upstream http://trips:8080;
            proxy_pass $trips_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The app sets its session cookie without Secure so it keeps working over plain HTTP in local dev 
            proxy_cookie_flags ~ secure;
        }
    }

    # Recipee - a separate project (~/dev/recipee-core), deployed independently
    server {
        listen 8080 http2;
        server_name recipe.dmoffat.com;

        return 301 https://recipe.dmoffat.com$request_uri;
    }

    server {
        listen 8443 ssl http2;
        server_name recipe.dmoffat.com;

        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;

        location / {
            # Docker's embedded DNS.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $recipee_upstream http://recipee:8080;
            proxy_pass $recipee_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # The app sets its session cookie without Secure so it keeps working over plain HTTP in local dev 
            proxy_cookie_flags ~ secure;
        }
    }
}
